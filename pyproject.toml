[project]
name = "parallax"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openrouter>=1.2.17",
    "pyright>=1.1.414",
    "python-dotenv>=1.2.3",
    "tavily-python>=0.8.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
